<div class="formulaire_spip formulaire_#FORM">
	[<p class="reponse_formulaire reponse_formulaire_ok">(#ENV**{message_ok})</p>]
	[<p class="reponse_formulaire reponse_formulaire_erreur">(#ENV*{message_erreur})</p>]
	[(#EDITABLE|oui)
	<form method="post" action="#ENV{action}"><div>
		#ACTION_FORMULAIRE
		<div class="editer-groupe">
			<div class="editer editer_nom[ (#ENV**{erreurs}|table_valeur{nom}|oui)erreur]">
				<label for="nom">Nom</label>
				[<span class="erreur_message">(#ENV**{erreurs}|table_valeur{nom})</span>]
				<input type="text" class="text" name="nom" id="nom" value="#ENV{nom}" />
			</div>
			<div class="editer editer_email obligatoire[ (#ENV**{erreurs}|table_valeur{email}|oui)erreur]">
				<label for="email">Email</label>
				[<span class="erreur_message">(#ENV**{erreurs}|table_valeur{email})</span>]
				<input type="email" class="text" name="email" id="email" value="#ENV{email}" />
			</div>
		</div>
		<p class="boutons"><input type="submit" class="submit" value="S'inscrire" /></p>
	</div></form>
	]
</div>
